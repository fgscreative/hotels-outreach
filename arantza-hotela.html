  <style>
    /*
    ============================================================
    CSS CUSTOM PROPERTIES
    ============================================================
    --color-primary:     #1A2E1C   deep Pyrenean forest green
    --color-secondary:   #C4A96A   golden moss / Navarran honey-amber
    --color-accent:      #8B6A3E   warm walnut / bark brown

    --color-text-muted:  #9E9687   warm grey / stone
    --font-serif:        'Cormorant Garamond', Georgia, serif
    --font-sans:         'DM Sans', system-ui, sans-serif
    ============================================================
    */

    :root {
      --color-primary:    #1A2E1C;
      --color-secondary:  #C4A96A;
      --color-accent:     #8B6A3E;
      --color-bg:         #0E1A0F;

      --color-text:       #F0EBE3;

      --font-sans:  'DM Sans', system-ui, -apple-system, sans-serif;
      --ease-smooth: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);

      -webkit-font-smoothing: antialiased;

    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── TYPE UTILITIES ── */
    .t-label {
      font-family: var(--font-sans);
      font-size: 0.6875rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-secondary);
      display: block;
    }
    .t-body {

      font-weight: 300;
      line-height: 1.8;
      color: var(--color-text-muted);
    }

    /* ── ACCESSIBILITY ── */
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }

    /* ============================================================
       PAGE LOADER
    ============================================================ */

      z-index: 9999;

      pointer-events: none;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;

      animation: loader-pulse 1.8s ease-in-out infinite;
    }
    .loader-bar {
      width: 80px;
      height: 1px;
      background: rgba(196,169,106,0.2);
      overflow: hidden;
    }
    .loader-bar-fill {
      height: 100%;
      background: var(--color-secondary);
      animation: loader-fill 1.5s var(--ease-smooth) forwards;
    }
    @keyframes loader-pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }

    .hero-divider {

    .scroll-hint {
      position: absolute;

       MANIFESTO

    #manifesto {

    #manifesto-canvas {

    }
    #manifesto-canvas.visible { opacity: 0.13; }

    #the-place {

    <div class="place-copy">
      <span class="t-label">The Place</span>
      <h2>Arantza.<br>Where Navarre<br><em>meets the sky.</em></h2>

      <!-- SWAP:COPY → the place paragraph 1 -->
      <p>
        The village of Arantza sits where the Bidasoa river begins — in a
        valley so green it holds light differently. Ancient beech forest
        climbs toward the French border; below, the Atlantic Coast is an hour
        by road.
      </p>

      <!-- SWAP:COPY → the place paragraph 2 -->
      <p>
        This is ecological Navarre at its most intact: air carrying pine
        resin and damp earth, dawn mist moving through oak canopy like
        something breathing. An EU Ecolabel hotel because the land

<script>
(function () {

  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

  /* ─────────────────────────────────────────

  ───────────────────────────────────────── */
  var loader = qs('#page-loader');
  function hideLoader() {
    if (!loader) return;
    loader.classList.add('hidden');
    loader.addEventListener('transitionend', function () {
      loader.remove();
    }, { once: true });
  }
  if (document.readyState === 'complete') {
    setTimeout(hideLoader, 700);
  } else {
    window.addEventListener('load', function () { setTimeout(hideLoader, 700); });
  }

  /* ─────────────────────────────────────────
     HEADER SCROLL STATE
  ───────────────────────────────────────── */
  var header = qs('#site-header');
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) {
      requestAnimationFrame(function () {
        if (header) header.classList.toggle('scrolled', window.scrollY > 70);
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  /* ─────────────────────────────────────────
     HERO ANIMATIONS (GSAP)
  ───────────────────────────────────────── */
  function initHero() {
    if (typeof gsap === 'undefined') return;

    tl
      .to('.hero-logo', { opacity: 1, y: 0, duration: 1.2, delay: 0.4 })
      .to('.t-line-inner', {
        y: '0%',
        duration: 1.1,
        stagger: 0.12,
        ease: 'power3.out'
      }, '-=0.8')
      .to('.hero-sub', { opacity: 1, y: 0, duration: 0.9 }, '-=0.5')
      .to('.scroll-hint', { opacity: 1, y: 0, duration: 0.7 }, '-=0.3');
  }

  /* ─────────────────────────────────────────
     SCROLL ANIMATIONS (ScrollTrigger)
  ───────────────────────────────────────── */
  function initScrollAnimations() {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    gsap.registerPlugin(ScrollTrigger);

    /* Manifesto lines */
    qsa('.m-line-inner').forEach(function (el, i) {
      gsap.to(el, {
        y: '0%',
        duration: 1.0,
        ease: 'power3.out',
        delay: i * 0.09,
        scrollTrigger: {
          trigger: el.closest('.m-line'),
          start: 'top 88%',
          toggleActions: 'play none none none'
        }
      });
    });

    /* Manifesto footnote + rule */
    gsap.to('.manifesto-footnote', {
      opacity: 1, y: 0, duration: 0.9, ease: 'power2.out',
      scrollTrigger: { trigger: '#manifesto', start: 'bottom 82%', toggleActions: 'play none none none' }
    });
    gsap.from('.manifesto-rule', {
      scaleX: 0, duration: 1.2, ease: 'power3.out',
      scrollTrigger: { trigger: '#manifesto', start: 'top 75%', toggleActions: 'play none none none' }
    });

    /* Experience cards */
    gsap.from('.exp-card', {
      y: 60, opacity: 0, stagger: 0.09, duration: 0.9, ease: 'power3.out',
      scrollTrigger: { trigger: '#experiences', start: 'top 78%', toggleActions: 'play none none none' }
    });

    /* Place image parallax */
    var placeImg = qs('#place-img');
    if (placeImg) {
      gsap.to(placeImg, {
        y: -70,
        ease: 'none',
        scrollTrigger: {
          trigger: '#the-place',
          start: 'top bottom',
          end: 'bottom top',
          scrub: true
        }
      });
    }

    /* Place copy reveal */
    gsap.from('.place-copy', {
      x: 30, opacity: 0, duration: 1.0, ease: 'power3.out',
      scrollTrigger: { trigger: '#the-place', start: 'top 70%', toggleActions: 'play none none none' }
    });

    /* Stats count-up */
    qsa('.stat-num').forEach(function (el) {
      var target = parseInt(el.getAttribute('data-target'), 10);
      if (!target || isNaN(target)) return;
      var obj = { val: 0 };
      ScrollTrigger.create({
        trigger: el,
        start: 'top 82%',
        once: true,
        onEnter: function () {
          gsap.to(obj, {
            val: target,
            duration: 2.2,
            ease: 'power2.out',
            onUpdate: function () {
              el.textContent = Math.round(obj.val);
            }
          });
        }
      });
    });

    /* Room cards */
    gsap.from('.r-card', {
      y: 40, opacity: 0, stagger: 0.07, duration: 0.85, ease: 'power2.out',
      scrollTrigger: { trigger: '#rooms', start: 'top 78%', toggleActions: 'play none none none' }
    });

    /* Ritual cards */
    gsap.from('.ritual-card', {
      y: 30, opacity: 0, stagger: 0.06, duration: 0.7, ease: 'power2.out',
      scrollTrigger: { trigger: '#wellness', start: 'top 78%', toggleActions: 'play none none none' }
    });

      y: 35, opacity: 0, duration: 1.2, ease: 'power3.out',

    gsap.from('.quote-mark-glyph', {
      y: -20, opacity: 0, duration: 1.0, ease: 'power2.out',
      scrollTrigger: { trigger: '#quote', start: 'top 70%', toggleActions: 'play none none none' }
    });

    /* Booking CTA */
    gsap.from('.booking-inner', {
      y: 40, opacity: 0, duration: 1.0, ease: 'power3.out',
      scrollTrigger: { trigger: '#booking', start: 'top 72%', toggleActions: 'play none none none' }
    });
  }

  /* ─────────────────────────────────────────
     LIGHTBOX
  ───────────────────────────────────────── */
  var lb = qs('#lightbox');
  var lbImg = qs('#lb-img');
  var lbClose = qs('#lb-close');

  function openLightbox(src, alt) {
    if (!lb || !lbImg) return;
    lbImg.src = src;
    lbImg.alt = alt || '';
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lbClose && lbClose.focus();
  }

  function closeLightbox() {
    if (!lb) return;
    lb.classList.remove('open');
    document.body.style.overflow = '';
    if (lbImg) { lbImg.src = ''; lbImg.alt = ''; }
  }

  qsa('.r-card[data-lb-src]').forEach(function (card) {
    function activate() {
      openLightbox(card.getAttribute('data-lb-src'), card.getAttribute('data-lb-alt'));
    }
    card.addEventListener('click', activate);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
    });
  });

  if (lbClose) lbClose.addEventListener('click', closeLightbox);
  if (lb) lb.addEventListener('click', function (e) { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && lb && lb.classList.contains('open')) closeLightbox();
  });

  /* ─────────────────────────────────────────
     INITIALISE ON DOM READY
  ───────────────────────────────────────── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      initHero();
      initScrollAnimations();
      init3DScene();
    });
  } else {
    initHero();
    initScrollAnimations();
    init3DScene();
  }

  /* ─────────────────────────────────────────
     THREE.JS — OAK LEAF 3D OBJECT
     SWAP:3D → oak leaf | Forest archetype
  ───────────────────────────────────────── */
  var GLB_URL = 'https://hotels3ds.s3.eu-north-1.amazonaws.com/Meshy_AI_A_single_mature_oak_l_0411161732_texture.glb';
  var threeRenderer, threeScene, threeCamera, threeModel, threeRAF;
  var leafHovered = false;

  function init3DScene() {
    var canvas = qs('#manifesto-canvas');
    if (!canvas) return;

    /* Load Three.js then GLTFLoader sequentially */
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function () {
      loadScript('https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js', function () {
        buildScene(canvas);
      });
    });
  }

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function () { console.warn('3D script failed:', src); };
    document.head.appendChild(s);
  }

  function buildScene(canvas) {
    if (typeof THREE === 'undefined') return;

    var W = canvas.offsetWidth || 520;
    var H = canvas.offsetHeight || 520;

    threeRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    threeRenderer.setSize(W, H);
    threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    if (threeRenderer.outputEncoding !== undefined) {
      threeRenderer.outputEncoding = THREE.sRGBEncoding;
    }

    threeScene = new THREE.Scene();

    threeCamera = new THREE.PerspectiveCamera(42, W / H, 0.05, 100);
    threeCamera.position.set(0, 0.2, 3.8);

    /* Three-point light rig: warm + cool + ambient */
    var warm = new THREE.DirectionalLight(0xfff0d0, 1.5);
    warm.position.set(2.5, 3, 2);
    threeScene.add(warm);

    var cool = new THREE.DirectionalLight(0xd0e8ff, 0.85);
    cool.position.set(-2, 1, -2);
    threeScene.add(cool);

    var ambient = new THREE.AmbientLight(0x304830, 0.7);
    threeScene.add(ambient);

    /* Load GLB */
    if (typeof THREE.GLTFLoader === 'undefined') {
      console.warn('GLTFLoader not available');
      return;
    }
    var loader = new THREE.GLTFLoader();
    loader.load(
      GLB_URL,
      function (gltf) {
        threeModel = gltf.scene;
        /* Normalise size and centre */
        var box = new THREE.Box3().setFromObject(threeModel);
        var centre = box.getCenter(new THREE.Vector3());
        var size = box.getSize(new THREE.Vector3());
        var maxDim = Math.max(size.x, size.y, size.z);
        var scale = 2.0 / maxDim;
        threeModel.scale.setScalar(scale);
        centre.multiplyScalar(scale);
        threeModel.position.sub(centre);
        threeScene.add(threeModel);

        /* Show canvas */
        canvas.classList.add('visible');

        startRenderLoop();
        observeVisibility(canvas);
      },
      undefined,
      function (err) { console.warn('GLB load error:', err); }
    );

    /* Hover pause */
    canvas.addEventListener('mouseenter', function () { leafHovered = true; });
    canvas.addEventListener('mouseleave', function () { leafHovered = false; });

    /* Responsive */
    var ro = new ResizeObserver(function () {
      if (!threeRenderer || !threeCamera) return;
      var w = canvas.offsetWidth;
      var h = canvas.offsetHeight;
      threeRenderer.setSize(w, h);
      threeCamera.aspect = w / h;
      threeCamera.updateProjectionMatrix();
    });
    ro.observe(canvas);
  }

  function startRenderLoop() {
    function tick() {
      threeRAF = requestAnimationFrame(tick);
      if (threeModel && !leafHovered) {
        threeModel.rotation.y += 0.002;
      }
      if (threeRenderer && threeScene && threeCamera) {
        threeRenderer.render(threeScene, threeCamera);
      }
    }
    if (threeRAF) cancelAnimationFrame(threeRAF);
    tick();
  }

  function observeVisibility(canvas) {
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        if (!threeRAF) startRenderLoop();
      } else {
        if (threeRAF) { cancelAnimationFrame(threeRAF); threeRAF = null; }
      }
    }, { threshold: 0.05 });
    io.observe(canvas);
  }

}());
</script>
